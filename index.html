
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1">
  <title>DJODA | Escáner QR</title>

  <script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.min.js"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 16px;
      background: #07144F;
      color: white;
      font-family: Arial, sans-serif;
      text-align: center;
    }

    main {
      max-width: 480px;
      margin: auto;
    }

    h1 {
      color: #D4F03C;
      font-size: 44px;
      margin: 12px 0 4px;
    }

    .subtitulo {
      color: #22D6F2;
      margin-bottom: 20px;
    }

    .caja {
      background: #0B1E8C;
      padding: 16px;
      border-radius: 16px;
      margin: 14px 0;
    }

    video {
      width: 100%;
      background: #020826;
      border-radius: 12px;
      display: block;
    }

    button {
      background: #D4F03C;
      color: #07144F;
      border: 0;
      border-radius: 10px;
      padding: 15px;
      font-size: 16px;
      font-weight: bold;
      margin: 8px 0;
      width: 100%;
      cursor: pointer;
    }

    button.secundario {
      background: #22D6F2;
    }

    input {
      width: 100%;
      padding: 13px;
      border-radius: 9px;
      border: 0;
      font-size: 16px;
    }

    #estado,
    #resultado {
      background: #243781;
      padding: 15px;
      border-radius: 10px;
      margin: 12px 0;
      overflow-wrap: anywhere;
    }

    #resultado {
      font-size: 18px;
      font-weight: bold;
      min-height: 65px;
    }

    .ok {
      background: #166534 !important;
    }

    .repetida {
      background: #854d0e !important;
    }

    .error {
      background: #991b1b !important;
    }

    .nota {
      font-size: 13px;
      color: #d2dcfa;
      line-height: 1.5;
    }

    [hidden] {
      display: none !important;
    }

    /* VENTANA EMERGENTE */

    .modal-fondo {
      position: fixed;
      inset: 0;
      z-index: 9999;
      background: rgba(0, 0, 25, 0.86);
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .modal-tarjeta {
      width: 100%;
      max-width: 430px;
      padding: 30px 22px;
      border-radius: 22px;
      box-shadow: 0 12px 45px rgba(0,0,0,.4);
      color: white;
    }

    .modal-tarjeta.good {
      background: #166534;
    }

    .modal-tarjeta.warn {
      background: #854d0e;
    }

    .modal-tarjeta.bad {
      background: #991b1b;
    }

    .modal-icono {
      font-size: 65px;
      margin-bottom: 12px;
    }

    .modal-tarjeta h2 {
      font-size: 27px;
      line-height: 1.2;
      margin: 0 0 16px;
    }

    .modal-tarjeta p {
      font-size: 19px;
      line-height: 1.5;
      margin: 0 0 22px;
      overflow-wrap: anywhere;
      white-space: pre-line;
    }

    #modalAceptar {
      background: #D4F03C;
      color: #07144F;
      font-size: 22px;
      padding: 18px;
      margin: 0;
    }

    /* Evita mover la pantalla tras el modal */

    body.modal-activo {
      overflow: hidden;
    }
  </style>
</head>

<body>
<main>

  <h1>DJODA</h1>

  <div class="subtitulo">
    CONTROL DE ACCESO · ESCÁNER QR
  </div>

  <div id="estado">
    Conectando con la aplicación...
  </div>

  <div class="caja">

    <video
      id="video"
      autoplay
      muted
      playsinline>
    </video>

    <button onclick="activarCamara()">
      Activar cámara
    </button>

    <button
      class="secundario"
      onclick="detenerCamara()">
      Detener cámara
    </button>

    <p class="nota">
      Apuntá al código QR.
      Esperá el resultado y presioná ACEPTAR
      para continuar.
    </p>

  </div>

  <div id="resultado"
       role="status"
       aria-live="polite">
    Esperando conexión...
  </div>

  <div class="caja">

    <h3>Validación manual</h3>

    <input
      id="codigoManual"
      type="text"
      placeholder="Pegá el código o enlace del QR">

    <button
      class="secundario"
      onclick="validarManual()">
      Validar código
    </button>

  </div>

  <p class="nota">
    El escáner necesita una sesión autorizada
    de DJODA. Los guardias no acceden
    directamente a Google Sheets.
  </p>

</main>

<!-- VENTANA DE RESULTADO -->

<div id="modalResultado"
     class="modal-fondo"
     role="dialog"
     aria-modal="true"
     aria-labelledby="modalTitulo"
     hidden>

  <div id="modalTarjeta" class="modal-tarjeta">

    <div id="modalIcono" class="modal-icono">
    </div>

    <h2 id="modalTitulo"></h2>

    <p id="modalDetalle"></p>

    <button id="modalAceptar"
            type="button"
            onclick="cerrarModal()">
      ACEPTAR
    </button>

  </div>
</div>

<script>
'use strict';

/* ===================================
   CONEXIÓN CON GOOGLE APPS SCRIPT
   =================================== */

const parametros = new URLSearchParams(
  location.hash.replace(/^#/, '')
);

const bridgeId =
  parametros.get('bridgeId') || '';

const parentOrigin =
  parametros.get('parentOrigin') || '';

const APP_ID = 'DJODA_V3';

const $ = id => document.getElementById(id);

let conectado = false;
let esperandoRespuesta = false;
let modalOpen = false;
let requiereRetirarQR = false;

let camara = null;
let detector = null;
let activo = false;
let procesandoImagen = false;

let ultimoAnalisis = 0;
let ausenciaDesde = 0;
let ultimoCodigo = '';

let temporizadorConexion = null;
let temporizadorRespuesta = null;

let audioContexto = null;

const intervaloAnalisis = 180;

/* ===================================
   FUNCIONES DE PANTALLA
   =================================== */

function mostrarEstado(texto) {
  $('estado').textContent = texto;
}

function mostrarResultado(texto, clase = '') {
  $('resultado').className = clase;
  $('resultado').textContent = texto;
}

function mostrarModal(tipo, titulo, detalle) {
  modalOpen = true;

  const tarjeta = $('modalTarjeta');

  tarjeta.className = 'modal-tarjeta ' + tipo;

  $('modalIcono').textContent =
    tipo === 'good' ? '✓' :
    tipo === 'warn' ? '⚠' : '✕';

  $('modalTitulo').textContent = titulo;
  $('modalDetalle').textContent = detalle || '';

  $('modalResultado').hidden = false;

  document.body.classList.add('modal-activo');

  $('modalAceptar').focus();
}

function cerrarModal() {
  $('modalResultado').hidden = true;

  document.body.classList.remove('modal-activo');

  modalOpen = false;

  if (!conectado) {
    mostrarEstado(
      'Sin conexión. Volvé al panel de DJODA.'
    );
    return;
  }

  // Se debe retirar el QR anterior
  // antes de permitir la siguiente lectura.
  requiereRetirarQR = true;
  ausenciaDesde = 0;

  mostrarEstado(
    'Retirá el QR anterior para continuar.'
  );
}

function errorTexto(e) {
  return e && e.message
    ? e.message
    : 'Error desconocido';
}

/* ===================================
   COMUNICACIÓN SEGURA ENTRE VENTANAS
   =================================== */

function origenPermitido(valor) {
  try {
    const u = new URL(valor);

    if (u.protocol !== 'https:') {
      return false;
    }

    return (
      u.hostname === 'script.google.com' ||
      u.hostname.endsWith('.googleusercontent.com')
    );

  } catch (e) {
    return false;
  }
}

function avisarPanel(tipo, extras = {}) {
  if (
    !window.opener ||
    window.opener.closed ||
    !origenPermitido(parentOrigin) ||
    !bridgeId ||
    bridgeId.length !== 48
  ) {
    return false;
  }

  window.opener.postMessage({
    app: APP_ID,
    tipo: tipo,
    bridgeId: bridgeId,
    ...extras
  }, parentOrigin);

  return true;
}

/* ===================================
   RESPUESTA DE GOOGLE APPS SCRIPT
   =================================== */

window.addEventListener('message', function(evento) {

  if (!origenPermitido(parentOrigin)) return;

  if (evento.origin !== parentOrigin) return;

  if (evento.source !== window.opener) return;

  const d = evento.data;

  if (
    !d ||
    d.app !== APP_ID ||
    d.bridgeId !== bridgeId ||
    d.tipo !== 'RESULTADO'
  ) {
    return;
  }

  const r = d.resultado || {};

  if (r.estado === 'CONECTADO') {
    conectado = true;

    clearInterval(temporizadorConexion);

    mostrarEstado(
      'Conectado con DJODA. Cámara lista.'
    );

    mostrarResultado(
      'Activá la cámara para comenzar.'
    );

    return;
  }

  // Ignorar respuestas tardías cuando ya se
  // mostró un resultado por tiempo agotado.
  if (!esperandoRespuesta) {
    return;
  }

  clearTimeout(temporizadorRespuesta);

  esperandoRespuesta = false;

  const persona = [
    r.nombre || '',
    r.numero || ''
  ].filter(Boolean).join(' · ');

  if (r.estado === 'OK') {

    mostrarResultado(
      'INGRESO AUTORIZADO — ' + persona,
      'ok'
    );

    sonido(true);

    mostrarModal(
      'good',
      'INGRESO AUTORIZADO',
      persona || 'Entrada válida'
    );

  } else if (r.estado === 'REPETIDA') {

    mostrarResultado(
      'ENTRADA YA UTILIZADA — ' + persona,
      'repetida'
    );

    sonido(false);

    mostrarModal(
      'warn',
      'ENTRADA YA UTILIZADA',
      persona || r.mensaje
    );

  } else {

    const detalle = [
      r.mensaje || 'Entrada no autorizada',
      persona
    ].filter(Boolean).join('\n');

    mostrarResultado(
      'NO AUTORIZADO — ' + detalle,
      'error'
    );

    sonido(false);

    mostrarModal(
      'bad',
      'NO AUTORIZADO',
      detalle
    );

    if (
      String(r.mensaje || '')
        .toLowerCase().includes('sesión venció')
    ) {
      conectado = false;
      detenerCamara();
    }
  }
});

/* ===================================
   SONIDO DE CONFIRMACIÓN
   =================================== */

function sonido(correcto) {
  try {
    const AudioClass =
      window.AudioContext ||
      window.webkitAudioContext;

    if (!AudioClass) return;

    audioContexto =
      audioContexto || new AudioClass();

    const oscilador =
      audioContexto.createOscillator();

    const volumen =
      audioContexto.createGain();

    oscilador.frequency.value =
      correcto ? 850 : 280;

    volumen.gain.value = 0.06;

    oscilador.connect(volumen);
    volumen.connect(audioContexto.destination);

    oscilador.start();

    oscilador.stop(
      audioContexto.currentTime + 0.16
    );

  } catch (e) {
    // El sonido es opcional.
  }
}

/* ===================================
   ENVIAR QR PARA VALIDAR
   =================================== */

function enviarCodigo(codigo) {
  if (modalOpen || esperandoRespuesta) {
    return false;
  }

  if (!conectado) {
    mostrarModal(
      'bad',
      'SIN CONEXIÓN',
      'Abrí el escáner desde el panel de DJODA.'
    );
    return false;
  }

  const valor = String(codigo || '').trim();

  if (!valor || valor.length > 2048) {
    mostrarModal(
      'bad',
      'QR INVÁLIDO',
      'El código está vacío o no es válido.'
    );
    sonido(false);
    return false;
  }

  esperandoRespuesta = true;

  mostrarResultado('Verificando entrada...');

  if (!avisarPanel('ESCANEO', {
    codigo: valor
  })) {
    esperandoRespuesta = false;
    conectado = false;

    mostrarModal(
      'bad',
      'ERROR DE CONEXIÓN',
      'No se pudo comunicar con Apps Script.'
    );

    return false;
  }

  temporizadorRespuesta = setTimeout(
    function() {
      if (!esperandoRespuesta) return;

      esperandoRespuesta = false;

      mostrarResultado(
        'No se pudo confirmar el ingreso.',
        'error'
      );

      mostrarModal(
        'bad',
        'SIN CONFIRMACIÓN',
        'No llegó una respuesta del servidor. ' +
        'Consultá la planilla antes de reintentar: ' +
        'el ingreso podría haberse registrado.'
      );
    },
    20000
  );

  return true;
}

/* ===================================
   VALIDACIÓN MANUAL
   =================================== */

function validarManual() {
  if (modalOpen || esperandoRespuesta) return;

  const codigo = $('codigoManual').value.trim();

  if (enviarCodigo(codigo)) {
    $('codigoManual').value = '';
  }
}

/* ===================================
   ACTIVAR CÁMARA
   =================================== */

const video = $('video');

const canvas = document.createElement('canvas');

const contexto = canvas.getContext(
  '2d', { willReadFrequently: true }
);

async function activarCamara() {
  if (activo) return;

  if (!conectado) {
    mostrarModal(
      'bad',
      'SIN AUTORIZACIÓN',
      'Iniciá sesión en DJODA y abrí el escáner desde el panel.'
    );
    return;
  }

  if (
    !navigator.mediaDevices ||
    !navigator.mediaDevices.getUserMedia
  ) {
    mostrarModal(
      'bad',
      'CÁMARA NO DISPONIBLE',
      'Este navegador no permite utilizar la cámara.'
    );
    return;
  }

  try {
    camara = await navigator.mediaDevices
      .getUserMedia({
        audio: false,
        video: {
          facingMode: { ideal: 'environment' },
          width: { ideal: 1280 },
          height: { ideal: 720 }
        }
      });

    video.srcObject = camara;

    await video.play();

    activo = true;
    detector = null;
    ultimoCodigo = '';
    ausenciaDesde = 0;
    requiereRetirarQR = false;

    if ('BarcodeDetector' in window) {
      try {
        const formatos =
          await BarcodeDetector.getSupportedFormats();

        if (formatos.includes('qr_code')) {
          detector = new BarcodeDetector({
            formats: ['qr_code']
          });
        }
      } catch (e) {
        detector = null;
      }
    }

    if (
      !detector &&
      typeof window.jsQR !== 'function'
    ) {
      detenerCamara();

      mostrarModal(
        'bad',
        'LECTOR NO DISPONIBLE',
        'No se pudo cargar el lector de códigos QR.'
      );
      return;
    }

    mostrarEstado(
      'Cámara activa. Escaneá una entrada.'
    );

    requestAnimationFrame(analizarImagen);

  } catch (e) {
    detenerCamara();

    mostrarModal(
      'bad',
      'ERROR DE CÁMARA',
      errorTexto(e)
    );
  }
}

/* ===================================
   DETENER CÁMARA
   =================================== */

function detenerCamara() {
  activo = false;

  if (camara) {
    camara.getTracks().forEach(
      pista => pista.stop()
    );

    camara = null;
  }

  video.srcObject = null;

  mostrarEstado(
    conectado
      ? 'Cámara detenida.'
      : 'Sin conexión con el panel.'
  );
}

/* ===================================
   ESCANEO CONTINUO
   =================================== */

async function analizarImagen(momento) {
  if (!activo) return;

  if (procesandoImagen) {
    requestAnimationFrame(analizarImagen);
    return;
  }

  if (momento - ultimoAnalisis < intervaloAnalisis) {
    requestAnimationFrame(analizarImagen);
    return;
  }

  ultimoAnalisis = momento;

  if (
    video.readyState < 2 ||
    esperandoRespuesta ||
    modalOpen
  ) {
    requestAnimationFrame(analizarImagen);
    return;
  }

  procesandoImagen = true;

  let codigo = '';

  try {
    if (detector) {
      const codigos = await detector.detect(video);

      if (codigos.length) {
        codigo = codigos[0].rawValue || '';
      }

    } else {
      const ancho = 480;

      const alto = Math.max(
        1,
        Math.round(
          video.videoHeight *
          (ancho / video.videoWidth)
        )
      );

      canvas.width = ancho;
      canvas.height = alto;

      contexto.drawImage(
        video, 0, 0, ancho, alto
      );

      const imagen = contexto.getImageData(
        0, 0, ancho, alto
      );

      const lectura = jsQR(
        imagen.data,
        ancho,
        alto,
        { inversionAttempts: 'attemptBoth' }
      );

      if (lectura) {
        codigo = lectura.data;
      }
    }

    // Bloquear nuevas lecturas hasta que
    // el guardia retire el QR anterior.
    if (requiereRetirarQR) {
      if (!codigo) {
        if (!ausenciaDesde) {
          ausenciaDesde = Date.now();
        }

        if (Date.now() - ausenciaDesde >= 1000) {
          requiereRetirarQR = false;
          ultimoCodigo = '';
          ausenciaDesde = 0;

          mostrarEstado(
            'Lista para la siguiente entrada.'
          );
        }
      } else {
        ausenciaDesde = 0;
      }

      return;
    }

    if (codigo) {
      ausenciaDesde = 0;

      if (codigo !== ultimoCodigo) {
        ultimoCodigo = codigo;
        enviarCodigo(codigo);
      }

    } else if (ultimoCodigo) {
      if (!ausenciaDesde) {
        ausenciaDesde = Date.now();
      }

      if (Date.now() - ausenciaDesde > 1200) {
        ultimoCodigo = '';
        ausenciaDesde = 0;
      }
    }

  } catch (e) {
    console.warn('Error de lectura QR:', e);

  } finally {
    procesandoImagen = false;

    if (activo) {
      requestAnimationFrame(analizarImagen);
    }
  }
}

/* ===================================
   CONEXIÓN INICIAL
   =================================== */

function solicitarConexion() {
  if (conectado) return;

  if (
    !origenPermitido(parentOrigin) ||
    !bridgeId ||
    !/^[a-f0-9]{48}$/i.test(bridgeId)
  ) {
    mostrarEstado(
      'Apertura no autorizada.'
    );

    mostrarResultado(
      'Abrí el escáner desde Apps Script.',
      'error'
    );

    return;
  }

  if (!window.opener) {
    mostrarEstado(
      'No se encontró el panel de DJODA.'
    );

    return;
  }

  avisarPanel('LISTO');

  temporizadorConexion = setInterval(
    function() {
      if (!conectado) {
        avisarPanel('LISTO');
      }
    },
    1500
  );
}

/* ===================================
   LIMPIEZA
   =================================== */

document.addEventListener(
  'visibilitychange',
  function() {
    if (document.hidden) {
      detenerCamara();
    }
  }
);

window.addEventListener(
  'beforeunload',
  detenerCamara
);

solicitarConexion();

</script>
</body>
</html>
