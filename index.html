
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width, initial-scale=1">
<title>DJODA | Escáner continuo</title>

<script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.min.js"></script>

<style>
  * { box-sizing: border-box; }

  body {
    margin: 0;
    padding: 18px;
    background: #07144F;
    color: white;
    font-family: Arial, sans-serif;
    text-align: center;
  }

  main {
    max-width: 480px;
    margin: auto;
  }

  h1 {
    color: #D4F03C;
    font-size: 44px;
    margin: 12px 0 4px;
  }

  .subtitulo {
    color: #22D6F2;
    margin-bottom: 20px;
  }

  .caja {
    background: #0B1E8C;
    padding: 16px;
    border-radius: 16px;
    margin: 14px 0;
  }

  #video {
    width: 100%;
    background: #020826;
    border-radius: 12px;
    display: block;
  }

  button {
    background: #D4F03C;
    color: #07144F;
    border: 0;
    border-radius: 10px;
    padding: 15px;
    font-size: 16px;
    font-weight: bold;
    margin: 8px 0;
    width: 100%;
    cursor: pointer;
  }

  button.secundario {
    background: #22D6F2;
  }

  input {
    width: 100%;
    padding: 13px;
    border-radius: 9px;
    border: 0;
    font-size: 16px;
  }

  #estado {
    padding: 13px;
    border-radius: 10px;
    background: #243781;
    margin: 12px 0;
    overflow-wrap: anywhere;
  }

  #resultado {
    padding: 20px;
    border-radius: 12px;
    font-size: 19px;
    font-weight: bold;
    background: #243781;
    margin-top: 15px;
    min-height: 90px;
    overflow-wrap: anywhere;
  }

  .ok {
    background: #166534 !important;
  }

  .repetida {
    background: #854d0e !important;
  }

  .error {
    background: #991b1b !important;
  }

  .nota {
    font-size: 13px;
    color: #d2dcfa;
    line-height: 1.5;
  }

  [hidden] { display: none !important; }
</style>
</head>

<body>
<main>

  <h1>DJODA</h1>
  <div class="subtitulo">
    CONTROL DE ACCESO · ESCÁNER QR
  </div>

  <div id="estado">
    Conectando con la aplicación...
  </div>

  <div class="caja">
    <video
      id="video"
      autoplay
      muted
      playsinline>
    </video>

    <button id="activar" onclick="activarCamara()">
      Activar cámara
    </button>

    <button class="secundario"
            onclick="detenerCamara()">
      Detener cámara
    </button>

    <p class="nota">
      Apuntá al código QR de cada entrada.
      Esperá el resultado antes de continuar.
    </p>
  </div>

  <div id="resultado" role="status"
       aria-live="polite">
    Esperando conexión...
  </div>

  <div class="caja">
    <h3>Validación manual</h3>

    <input
      id="codigoManual"
      type="text"
      placeholder="Pegá el código o enlace del QR">

    <button class="secundario"
            onclick="validarManual()">
      Validar código
    </button>
  </div>

  <p class="nota">
    El acceso a Google Sheets permanece
    reservado a los administradores.
    Esta pantalla no contiene contraseñas.
  </p>

</main>

<script>
'use strict';

// Datos de conexión recibidos desde Apps Script.
const parametros = new URLSearchParams(
  location.hash.replace(/^#/, '')
);

const bridgeId = parametros.get('bridgeId') || '';
const parentOrigin =
  parametros.get('parentOrigin') || '';

const video = document.getElementById('video');
const canvas = document.createElement('canvas');
const contexto = canvas.getContext(
  '2d', { willReadFrequently: true }
);

let conectado = false;
let esperandoRespuesta = false;
let camara = null;
let detector = null;
let activo = false;
let procesandoImagen = false;
let ultimoAnalisis = 0;
let ultimoCodigo = '';
let ausenciaDesde = 0;
let temporizadorRespuesta = null;
let temporizadorConexion = null;

const intervaloAnalisis = 180;

// Validar el origen del panel de Apps Script.
function origenPermitido(valor) {
  try {
    const u = new URL(valor);

    if (u.protocol !== 'https:') return false;

    return (
      u.hostname === 'script.google.com' ||
      u.hostname.endsWith('.googleusercontent.com')
    );
  } catch (e) {
    return false;
  }
}

function mostrarEstado(texto) {
  document.getElementById('estado').textContent =
    texto;
}

function mostrarResultado(texto, clase = '') {
  const elemento =
    document.getElementById('resultado');

  elemento.className = clase;
  elemento.textContent = texto;
}

function errorTexto(e) {
  return e && e.message
    ? e.message
    : 'Error desconocido';
}

function avisarPanel(tipo, extras = {}) {
  if (
    !window.opener ||
    window.opener.closed ||
    !origenPermitido(parentOrigin) ||
    !bridgeId
  ) {
    return false;
  }

  window.opener.postMessage({
    app: 'DJODA_V3',
    tipo: tipo,
    bridgeId: bridgeId,
    ...extras
  }, parentOrigin);

  return true;
}

// Solo aceptar mensajes del panel autorizado.
window.addEventListener('message', function(evento) {
  if (!origenPermitido(parentOrigin)) return;

  if (evento.origin !== parentOrigin) return;

  if (evento.source !== window.opener) return;

  const d = evento.data;

  if (
    !d ||
    d.app !== 'DJODA_V3' ||
    d.bridgeId !== bridgeId ||
    d.tipo !== 'RESULTADO'
  ) {
    return;
  }

  const r = d.resultado || {};

  if (r.estado === 'CONECTADO') {
    conectado = true;

    clearInterval(temporizadorConexion);

    mostrarEstado(
      'Conectado con DJODA. Cámara lista.'
    );

    mostrarResultado(
      'Activá la cámara para comenzar.'
    );

    return;
  }

  clearTimeout(temporizadorRespuesta);
  esperandoRespuesta = false;

  const persona = [
    r.numero || '',
    r.nombre || ''
  ].filter(Boolean).join(' · ');

  const mensaje = [
    r.mensaje || 'Sin respuesta',
    persona
  ].filter(Boolean).join(' — ');

  if (r.estado === 'OK') {
    mostrarResultado(
      '✓ INGRESO AUTORIZADO — ' + mensaje,
      'ok'
    );
    sonido(true);

  } else if (r.estado === 'REPETIDA') {
    mostrarResultado(
      '⚠ ENTRADA YA UTILIZADA — ' + mensaje,
      'repetida'
    );
    sonido(false);

  } else {
    mostrarResultado(
      '✕ NO AUTORIZADO — ' + mensaje,
      'error'
    );
    sonido(false);

    if (
      String(r.mensaje || '')
        .toLowerCase().includes('sesión venció')
    ) {
      conectado = false;
      mostrarEstado(
        'Sesión vencida. Volvé a ingresar al panel.'
      );
      detenerCamara();
    }
  }
});

// Señal sonora opcional.
let audioContexto = null;

function sonido(correcto) {
  try {
    const AudioClass =
      window.AudioContext ||
      window.webkitAudioContext;

    if (!AudioClass) return;

    audioContexto =
      audioContexto || new AudioClass();

    const oscilador =
      audioContexto.createOscillator();

    const volumen =
      audioContexto.createGain();

    oscilador.frequency.value =
      correcto ? 850 : 280;

    volumen.gain.value = 0.06;

    oscilador.connect(volumen);
    volumen.connect(audioContexto.destination);

    oscilador.start();

    oscilador.stop(
      audioContexto.currentTime + 0.16
    );
  } catch (e) {}
}

function enviarCodigo(codigo) {
  if (!conectado) {
    mostrarResultado(
      'No hay conexión con el panel.',
      'error'
    );
    return false;
  }

  if (esperandoRespuesta) return false;

  const valor = String(codigo || '').trim();

  if (!valor || valor.length > 2048) {
    mostrarResultado(
      'Código no válido.',
      'error'
    );
    return false;
  }

  esperandoRespuesta = true;

  mostrarResultado(
    'Verificando entrada...'
  );

  if (!avisarPanel('ESCANEO', {
    codigo: valor
  })) {
    esperandoRespuesta = false;
    conectado = false;

    mostrarEstado(
      'No se pudo comunicar con el panel.'
    );

    return false;
  }

  temporizadorRespuesta = setTimeout(
    function() {
      if (!esperandoRespuesta) return;

      esperandoRespuesta = false;

      mostrarResultado(
        'No llegó la respuesta. Consultá el estado ' +
        'antes de volver a intentar.',
        'error'
      );
    },
    20000
  );

  return true;
}

function validarManual() {
  const codigo =
    document.getElementById('codigoManual')
      .value.trim();

  if (enviarCodigo(codigo)) {
    document.getElementById('codigoManual')
      .value = '';
  }
}

async function activarCamara() {
  if (activo) return;

  if (!conectado) {
    mostrarResultado(
      'Primero iniciá sesión en Apps Script ' +
      'y abrí el escáner desde allí.',
      'error'
    );
    return;
  }

  if (!navigator.mediaDevices ||
      !navigator.mediaDevices.getUserMedia) {
    mostrarResultado(
      'Este navegador no permite usar la cámara.',
      'error'
    );
    return;
  }

  try {
    camara = await navigator.mediaDevices
      .getUserMedia({
        audio: false,
        video: {
          facingMode: { ideal: 'environment' },
          width: { ideal: 1280 },
          height: { ideal: 720 }
        }
      });

    video.srcObject = camara;

    await video.play();

    activo = true;
    ultimoCodigo = '';
    ausenciaDesde = 0;

    if ('BarcodeDetector' in window) {
      try {
        const formatos =
          await BarcodeDetector.getSupportedFormats();

        if (formatos.includes('qr_code')) {
          detector = new BarcodeDetector({
            formats: ['qr_code']
          });
        }
      } catch (e) {
        detector = null;
      }
    }

    if (!detector &&
        typeof window.jsQR !== 'function') {
      detenerCamara();

      mostrarResultado(
        'No se pudo cargar el lector QR.',
        'error'
      );
      return;
    }

    mostrarEstado(
      'Cámara activa. Escaneá una entrada.'
    );

    requestAnimationFrame(analizarImagen);

  } catch (e) {
    detenerCamara();

    mostrarResultado(
      'No se pudo activar la cámara: ' +
      errorTexto(e),
      'error'
    );
  }
}

function detenerCamara() {
  activo = false;

  if (camara) {
    camara.getTracks().forEach(
      pista => pista.stop()
    );

    camara = null;
  }

  video.srcObject = null;

  mostrarEstado(
    conectado
      ? 'Cámara detenida.'
      : 'Sin conexión con el panel.'
  );
}

async function analizarImagen(momento) {
  if (!activo) return;

  if (procesandoImagen) {
    requestAnimationFrame(analizarImagen);
    return;
  }

  if (momento - ultimoAnalisis < intervaloAnalisis) {
    requestAnimationFrame(analizarImagen);
    return;
  }

  ultimoAnalisis = momento;

  if (video.readyState < 2) {
    requestAnimationFrame(analizarImagen);
    return;
  }

  if (esperandoRespuesta) {
    requestAnimationFrame(analizarImagen);
    return;
  }

  procesandoImagen = true;

  let codigo = '';

  try {
    if (detector) {
      const codigos = await detector.detect(video);

      if (codigos.length) {
        codigo = codigos[0].rawValue || '';
      }

    } else {
      const ancho = 480;

      const alto = Math.max(
        1,
        Math.round(
          video.videoHeight *
          (ancho / video.videoWidth)
        )
      );

      canvas.width = ancho;
      canvas.height = alto;

      contexto.drawImage(
        video, 0, 0, ancho, alto
      );

      const imagen = contexto.getImageData(
        0, 0, ancho, alto
      );

      const lectura = jsQR(
        imagen.data,
        ancho,
        alto,
        { inversionAttempts: 'attemptBoth' }
      );

      if (lectura) {
        codigo = lectura.data;
      }
    }

    if (codigo) {
      ausenciaDesde = 0;

      // No repetir indefinidamente el mismo QR
      // si continúa delante de la cámara.
      if (codigo !== ultimoCodigo) {
        ultimoCodigo = codigo;
        enviarCodigo(codigo);
      }

    } else if (ultimoCodigo) {
      // El QR debe retirarse de la cámara durante
      // un momento para habilitar otra lectura.
      if (!ausenciaDesde) {
        ausenciaDesde = Date.now();
      }

      if (Date.now() - ausenciaDesde > 1200) {
        ultimoCodigo = '';
        ausenciaDesde = 0;
      }
    }

  } catch (e) {
    console.warn('Lectura de QR:', e);

  } finally {
    procesandoImagen = false;

    if (activo) {
      requestAnimationFrame(analizarImagen);
    }
  }
}

// Comunicación inicial con Apps Script.
function solicitarConexion() {
  if (conectado) return;

  if (!origenPermitido(parentOrigin) ||
      !bridgeId ||
      bridgeId.length !== 48) {
    mostrarEstado(
      'Apertura no autorizada. ' +
      'Ingresá primero desde Apps Script.'
    );

    mostrarResultado(
      'El escáner debe abrirse desde el panel.',
      'error'
    );
    return;
  }

  if (!window.opener) {
    mostrarEstado(
      'No se encontró la ventana de Apps Script.'
    );

    mostrarResultado(
      'Volvé al panel y abrí el escáner desde allí.',
      'error'
    );
    return;
  }

  avisarPanel('LISTO');

  temporizadorConexion = setInterval(
    function() {
      if (!conectado) avisarPanel('LISTO');
    },
    1500
  );
}

document.addEventListener(
  'visibilitychange',
  function() {
    if (document.hidden) {
      // Evitar mantener la cámara activa
      // cuando la página deja de estar visible.
      detenerCamara();
    }
  }
);

window.addEventListener(
  'beforeunload',
  detenerCamara
);

solicitarConexion();
</script>
</body>
</html>
